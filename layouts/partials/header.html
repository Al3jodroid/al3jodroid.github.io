<header class="site-header">
  <div class="site-title-container">
    <a class="site-title" href="{{ .Site.Home.RelPermalink }}">{{ .Params.title | default "CV" }}</a>
  </div>
  <div class="header-actions">
    <!-- Language Switcher -->
    {{ range .Translations }}
      <a href="{{ .RelPermalink }}" class="lang-btn" title="{{ i18n "switch_language" }}">
        {{ i18n "switch_language" }}
      </a>
    {{ else }}
      {{ if eq .Site.Language.Lang "en" }}
        <a href="{{ "/es/" | relURL }}" class="lang-btn" title="{{ i18n "switch_language" }}">
          {{ i18n "switch_language" }}
        </a>
      {{ else }}
        <a href="{{ "/" | relURL }}" class="lang-btn" title="{{ i18n "switch_language" }}">
          {{ i18n "switch_language" }}
        </a>
      {{ end }}
    {{ end }}

    <!-- Print CV Button -->
    <button onclick="expandAllForPrint(); setTimeout(() => window.print(), 100);" title="{{ i18n "print_cv" }}" class="btn-icon" id="print-btn">
      <i class="bi bi-printer"></i>
    </button>

    <!-- Theme Toggle -->
    <i
      class="bi bi-brightness-high theme-toggle theme-toggle-btn"
      onclick="toggleTheme()"
      role="button"
      aria-label="Toggle theme"
    ></i>
  </div>
</header>

{{ partial "toggleTheme.html" . }}
