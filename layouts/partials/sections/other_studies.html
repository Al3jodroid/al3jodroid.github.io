<!-- 6. Otros Estudios y Participaciones / Other Studies and Participations -->
{{ if .Params.other_studies }}
<div class="accordion-section section-other-studies">
  <h2 class="accordion">
    <button type="button" class="accordion-trigger" aria-expanded="false" onclick="expandAccordion(this)">
      <span class="accordion-header-lead">
        <i class="bi bi-award-fill" aria-hidden="true"></i>
        <span>{{ i18n "other_studies_title" | default "Other Studies and Participations" }}</span>
      </span>
      <i class="bi bi-chevron-down accordion-chevron" aria-hidden="true"></i>
    </button>
  </h2>
  <div class="panel">
    <div class="panel-body">
      {{ range .Params.other_studies }}
      <div class="study-card">
        {{ with .period }}
        <p class="study-period">{{ . }}</p>
        {{ end }}
        <h3 class="study-title">{{ .title }}</h3>
        {{ with .institution }}
        <div class="study-institution">{{ . }}</div>
        {{ end }}
      </div>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
