<!-- 8. Referencias / References -->
{{ if .Params.references }}
<div class="accordion-section section-references">
  <h2 class="accordion">
    <button type="button" class="accordion-trigger" aria-expanded="false" onclick="expandAccordion(this)">
      <span class="accordion-header-lead">
        <i class="bi bi-people-fill" aria-hidden="true"></i>
        <span>{{ i18n "references_title" | default "References" }}</span>
      </span>
      <i class="bi bi-chevron-down accordion-chevron" aria-hidden="true"></i>
    </button>
  </h2>
  <div class="panel">
    <div class="panel-body">
      <div class="reference-grid">
        {{ range .Params.references }}
        <div class="reference-card">
          <div class="reference-info">
            <h3 class="reference-name">{{ .name }}</h3>
            <p class="reference-role">{{ .role }}</p>
          </div>
          {{ with or .linkedin .url }}
          <div class="reference-actions">
            <a href="{{ . }}" target="_blank" rel="noopener" class="project-btn reference-btn" title="LinkedIn Profile">
              <i class="bi bi-linkedin"></i>
              <span>LinkedIn</span>
              <i class="bi bi-box-arrow-up-right project-btn-icon"></i>
            </a>
          </div>
          {{ end }}
        </div>
        {{ end }}
      </div>
    </div>
  </div>
</div>
{{ end }}
